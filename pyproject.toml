[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aisdlc"
version = "0.1.0"
description = "AI-native Application Lifecycle Management system"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Your Name", email = "your@email.com"}
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "typer>=0.9",
    "rich>=13.0",
    "greenlet>=3.5.6",
    "aiosqlite>=0.22.1",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

langchain = [
    "langchain>=0.1",
    "langchain-openai>=0.1",
    "langsmith>=0.1",
    "langgraph>=0.1",
]

[project.scripts]
aialm = "aisdlc.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# §22: the default run must stay fast and deterministic, so every tier that
# needs a real model, a real network, or real infrastructure is deselected
# here and selected explicitly with -m.
addopts = "-m 'not e2e_smoke and not e2e and not integration'"
markers = [
    "graph: LangGraph flow tests with mocked models and tools (§21)",
    "e2e_smoke: cheap real-agent gate, 1 repository, 1 provider (Rule 0.8)",
    "e2e: real agent, real model, real repository, opt-in (Rule 0.8)",
    "integration: real Postgres, pgvector or Redis, opt-in (§22)",
]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/aisdlc"]
